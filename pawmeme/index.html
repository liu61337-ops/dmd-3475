<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawMemes</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">🐾 PawMemes</div>

    <div class="nav-controls">
      <input
        type="text"
        id="searchInput"
        class="search-bar"
        placeholder="Search memes..."
      />

      <select id="filterCategory" class="control-select">
        <option value="all">All Categories</option>
        <option value="funny">Funny</option>
        <option value="cute">Cute</option>
        <option value="chaotic">Chaotic</option>
        <option value="relatable">Relatable</option>
      </select>

      <select id="sortMemes" class="control-select">
        <option value="default">Sort Memes</option>
        <option value="az">Title A-Z</option>
        <option value="za">Title Z-A</option>
        <option value="likesHighLow">Likes High-Low</option>
        <option value="likesLowHigh">Likes Low-High</option>
      </select>
    </div>
  </header>

  <section class="hero">
    <h1>Make your own dog memes 🐶</h1>
    <p>Create, edit, search, and save your favorite dog memes.</p>
  </section>

  <main class="main-content">
    <section class="form-section">
      <div class="section-header">
        <h2>Create a Meme</h2>
        <button id="randomDogBtn" class="secondary-btn" type="button">Get Random Dog</button>
      </div>

      <form id="memeForm" class="meme-form">
  <div class="form-grid">
    <div>
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" placeholder="Enter meme title" required />
    </div>

    <div>
      <label for="categoryInput">Category</label>
      <select id="categoryInput">
        <option value="funny">Funny</option>
        <option value="cute">Cute</option>
        <option value="chaotic">Chaotic</option>
        <option value="relatable">Relatable</option>
      </select>
    </div>

    <div>
      <label for="textPosition">Text Position</label>
      <select id="textPosition">
        <option value="both">Top & Bottom</option>
        <option value="top">Top Only</option>
        <option value="bottom">Bottom Only</option>
      </select>
    </div>

    <div>
      <label for="fontSizeInput">Text Size</label>
      <input type="range" id="fontSizeInput" min="20" max="56" value="36" />
      <p id="fontSizeLabel" class="small-label">36px</p>
    </div>

    <div>
      <label for="topTextInput">Top Text</label>
      <input type="text" id="topTextInput" placeholder="Type top text here" />
    </div>

    <div>
      <label for="bottomTextInput">Bottom Text</label>
      <input type="text" id="bottomTextInput" placeholder="Type bottom text here" />
    </div>
  </div>

  <div class="image-preview-wrap">
    <div class="preview-meme-wrap">
      <img id="previewImage" class="preview-image" alt="Dog meme preview" />
      <div id="previewTopText" class="preview-meme-text preview-top"></div>
      <div id="previewBottomText" class="preview-meme-text preview-bottom"></div>
    </div>

    <p id="previewStatus" class="preview-status">Click "Get Random Dog" to load an image.</p>
  </div>

  <div class="form-actions">
    <button type="submit" class="primary-btn">Save Meme</button>
  </div>
</form>
    </section>

    <section class="gallery-section">
  <div class="section-header">
    <div>
      <h2>Meme Gallery</h2>
      <p id="memeCount" class="section-subtext">0 memes</p>
    </div>

    <button id="resetBtn" class="secondary-btn">Reset</button>
  </div>

  <div id="memeGrid" class="meme-grid"></div>
</section>
  </main>

  <div class="modal-overlay hidden" id="editModal">
    <div class="modal">
      <div class="modal-top">
        <h2>Edit Meme</h2>
        <button id="closeModalBtn" class="icon-btn" type="button">✕</button>
      </div>

      <form id="editForm" class="modal-form">
        <label for="editTitle">Title</label>
        <input type="text" id="editTitle" required />

        <label for="editTopText">Top Text</label>
        <input type="text" id="editTopText" required />

        <label for="editBottomText">Bottom Text</label>
        <input type="text" id="editBottomText" required />

        <label for="editCategory">Category</label>
        <select id="editCategory">
          <option value="funny">Funny</option>
          <option value="cute">Cute</option>
          <option value="chaotic">Chaotic</option>
          <option value="relatable">Relatable</option>
        </select>

        <label for="editLikes">Likes</label>
        <input type="number" id="editLikes" min="0" value="0" />

        <button type="submit" class="primary-btn">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
