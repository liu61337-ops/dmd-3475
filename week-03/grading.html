<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Week 3 — Coding for the Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
        max-width: 70em;
        margin: 0 auto;
    }
  </style>
</head>
<body>
  <script>
        //new project!
        // ask the user for their "grade" and tell them what letter grade they got

        var grade = prompt("What was your grade?");

        if (parseInt(grade) >= 90){
            alert("You got an A!");
        }
        else if (parseInt(grade) >= 80){
            alert("You got a B!");
        }
        else if (parseInt(grade) >= 70){
            alert("You got a C!");
        }
        else if (parseInt(grade) >= 60){
            alert("You got a D!");
        }
        else {
            alert("You got an F!");
        }
        

  </script>
</body>
</html>
